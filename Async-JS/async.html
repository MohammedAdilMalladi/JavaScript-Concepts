<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asynchronous Programming in JS</title>
</head>
<body>
    <script>
        // Difference between synchronous and Asynchronous programming
// 1. Synchronous programming - Synchronous means the code runs in a particular sequence given in the program each instruction waits for the previous instruction to complete it's execution

// 2. Asynchronous Programming - Due to synchronous programming, some of the important instructions get blocked due to some previous instructions, which causes delay in the UI. Asynchronous code execution allows to execute next instructions immediately and does not block the flow

//Asynchronous programming example

// setInterval - setInterval() is used to execute a function repeatedly at a specified interval (in milliseconds).
setInterval(() => {
    console.log("Hello");
}, 4000);

// setTimeout - setTimeout() is used to execute a function once after a specified delay (in milliseconds).
setTimeout(() => {
    console.log("Async JS");
}, 2000);

// callback - callback is a function passed as an argument to another function 
function sum(a, b) {
    return a + b;
}

function calculator(a, b, sumCallback) {
    console.log(sumCallback(a, b));
};

calculator(5, 5, sum); //10

//callback hell - Nested callbacks stacked below one another forming a pyramid structure (Pyramid of Doom), This style of programming becomes difficult to understand & manage

function getData(dataId, getNextData) {
    setTimeout(() => {
        console.log("data ", dataId);
        if(getNextData){
            getNextData();
        }
    }, 2000);
}

// //callback hell
getData(1, () => {
    console.log("fetching data 2");
    getData(2, () => {
        console.log("fetching data 3");
        getData(3, () => {
            console.log("fetching data 4");
            getData(4);
        });
    });
});

//Promises - Promise is for eventual completion of task. It is an object in JS It is a solution to callback hell
//syntax 
// let promise = new Promise((resolve, reject) => {.....});
// resolve and reject are called as handlers and resolve and reject are callbacks provided by JS

// Promise has 3 states 
// 1. pending - the result is undefined
// 2. fulfilled - the result is a value [resolve]
// 3. rejected - the result is an error object [reject]

//resolve() - it is a function that is automatically created by JS internally
// example - 
let p1 = new Promise((resolve, reject) => {
    console.log("inside promise");
    resolve("success");
});

//reject() - it is also a function that is automatically created by JS internally
// example -
let p2 = new Promise((resolve, reject) => {
        console.log("inside promise");
        reject("error");
});

function getData(dataId){
    return new Promise((resolve, reject) => {
        setTimeout(() => {
            console.log("data ", dataId);
            resolve("success");
            // reject("error");
        }, 2000);
    });
};

const getPromise = () => {
    return new Promise((resolve, reject) => {
        console.log("inside promise");
        // resolve("Promise has been resolved");
        reject("some error has occured");
    });
};

let promise = getPromise();
promise.then((res) => {
        console.log("fulfilled", res);
});

promise.catch((err) => {
    console.log(err);
});

//Promise chaining
console.log("fetching data 1");
getData(1).then(() => {
    console.log("fetching data 2");
    return getData(2);
}).then(() => {
    console.log("fetching data 3");
    return getData(3);
}).then(() => {
    console.log("fetching data 4");
    return getData(4);
}).then((res) => {
    console.log(res);
});

//Async-Await - async function always returns a promise
// syntax -
// async function myFunc(){......};
// await - await pauses the execution of its surrounding async function until the promise is settled

function api(){
    return new Promise((resolve, reject) => {
        setTimeout(() => {
            console.log("Weather Data");
            resolve(200);
        }, 2000);
    });
};

async function getWeatherData(){
    await api();
    await api();
};

console.log("test 1");
console.log("test 2");

function getData(dataId){
    return new Promise((resolve, reject) => {
        setTimeout(() => {
            console.log("data ", dataId);
            resolve(200);
        }, 2000);
    });
};

async function getAllData(){
    console.log("fetching data 1.....");
    await getData(1);
    console.log("fetching data 2.....");
    await getData(2);
    console.log("fetching data 3.....");
    await getData(3);
    console.log("fetching data 4.....");
    await getData(4);
    console.log("fetching data 5.....");
    await getData(5);
}

console.log("test 3");
console.log("test 4");

// IIFE - stands for Immediately Invoked function expression, IIFE is a function that is called immediately as soon as it is defined. it starts with parenthesis and ends with parenthesis and to immediately call the function at last we need to specify the both parenthesis followed by a parenthesis. 
// note - it only runs one time
(async function(){
    console.log("fetching data 1.....");
    await getData(1);
    console.log("fetching data 2.....");
    await getData(2);
    console.log("fetching data 3.....");
    await getData(3);
    console.log("fetching data 4.....");
    await getData(4);
    console.log("fetching data 5.....");
    await getData(5);
})();
    </script>
</body>
</html>
